[project]
name = "pipeline"
version = "0.1.0"
description = "Ingesta de clima, produccion DGSIAP y precios; modelo de aptitud agricola"
requires-python = ">=3.13"
dependencies = [
    "agrodb",
    "pandas>=2.2",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "yarl>=1.15",
    "lxml>=5.3",
]

[project.scripts]
agro-pipeline = "pipeline.cli:main"

[tool.uv.sources]
agrodb = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
