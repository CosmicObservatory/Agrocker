[project]
name = "dashboard"
version = "0.1.0"
description = "Dashboard Dash de aptitud agricola por estado"
requires-python = ">=3.13"
dependencies = [
    "agrodb",
    "dash>=2.18",
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.scripts]
agro-dashboard = "dashboard.app:main"

[tool.uv.sources]
agrodb = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
